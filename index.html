<meta name="theme-color" content="#1B9A8F">
<style>
  :root{ --brand:#1B9A8F; --accent:#EE6A4D; --ink:#27272a; --line:#e4e4e7; --paper:#FDF7EF; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Segoe UI",Tahoma,system-ui,sans-serif; background:var(--paper); color:var(--ink); line-height:1.8; }
  .wrap{ max-width:660px; margin:0 auto; padding:0 18px 70px; }
  header{ text-align:center; padding:34px 16px 24px; position:relative; overflow:hidden; }
  .logo{ width:150px; height:auto; display:block; margin:0 auto 10px; }
  .pill{ display:inline-block; background:var(--brand); color:#fff; font-weight:700; font-size:13px; padding:7px 18px; border-radius:999px; }
  h1{ color:var(--accent); font-size:32px; margin:14px 0 10px; }
  header p{ color:#52525b; max-width:540px; margin:8px auto; }
  .blob{ position:absolute; border-radius:50%; pointer-events:none; }
  .facts{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:18px 0 0; text-align:right; }
  .fact{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:13px; color:#3f3f46; }
  .fact b{ color:var(--brand); display:block; font-size:14px; }
  .fact s{ color:#a1a1aa; font-weight:400; }
  .sec{ margin:28px 0 6px; }
  .sec h2{ color:var(--brand); font-size:19px; margin:0; }
  .sec .bar{ height:4px; width:52px; background:var(--brand); border-radius:99px; margin-top:6px; }
  .sec p{ color:#71717a; font-size:13px; margin:6px 0 0; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin:12px 0; }
  .field{ margin:16px 0; }
  .field:first-child{ margin-top:0; }
  label.q{ display:block; font-weight:700; margin-bottom:8px; font-size:15px; }
  .req{ color:var(--accent); }
  input[type=text],input[type=number],select,textarea{ width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; font-family:inherit; font-size:15px; background:#fff; color:var(--ink); }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--brand); }
  .opts{ display:grid; grid-template-columns:1fr; gap:7px; }
  .opt{ display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:11px; padding:10px 12px; cursor:pointer; font-size:14px; transition:.15s; background:#fff; }
  .opt:hover{ border-color:color-mix(in srgb,var(--brand) 40%,var(--line)); }
  .opt input{ accent-color:var(--brand); flex:none; }
  .opt.on{ border-color:var(--brand); background:color-mix(in srgb,var(--brand) 7%,#fff); }
  .submit{ width:100%; background:var(--accent); color:#fff; border:none; border-radius:16px; padding:16px; font-size:18px; font-weight:800; cursor:pointer; font-family:inherit; margin-top:10px; }
  .submit:disabled{ opacity:.6; }
  .note{ background:color-mix(in srgb,var(--brand) 6%,#fff); border:1px solid color-mix(in srgb,var(--brand) 25%,#fff); border-radius:14px; padding:14px 16px; font-size:14px; color:#52525b; }
  .err{ color:#dc2626; font-size:13px; margin-top:6px; display:none; }
  .center{ text-align:center; }
  footer{ text-align:center; color:#a1a1aa; font-size:12px; margin-top:30px; }
</style>
</head>

function optHtml(q){
  if(q.type==='text') return `<input type="text" id="${q.id}" placeholder="${q.placeholder||''}" oninput="answers['${q.id}']=this.value">`;
  const list = q.scale ? SCALE4 : q.opts;
  const type = q.type==='multi' ? 'checkbox' : 'radio';
  return `<div class="opts">${list.map(([t,p],j)=>`
    <label class="opt" onclick="setTimeout(()=>markOpt(this),0)">
      <input type="${type}" name="${q.id}" value="${j}" onchange="pick('${q.id}',${j},${p===null?'null':p},this)"> <span>${esc(t)}</span>
    </label>`).join('')}</div>`;
}
function markOpt(lbl){
  const group = lbl.closest('.opts'); const inp = lbl.querySelector('input');
  if(inp.type==='radio'){ group.querySelectorAll('.opt').forEach(o=>o.classList.remove('on')); lbl.classList.add('on'); }
  else lbl.classList.toggle('on', inp.checked);
}
function pick(id,j,points,el){
  const q = Q.find(x=>x.id===id); const list = q.scale?SCALE4:q.opts;
  if(q.type==='multi'){
    answers[id] = answers[id]||[];
    const t = list[j][0];
    if(el.checked){ if(!answers[id].includes(t)) answers[id].push(t); } else answers[id] = answers[id].filter(x=>x!==t);
  } else answers[id] = { label:list[j][0], points, j };
  const e=document.getElementById('e_'+id); if(e) e.style.display='none';
}

  const failedGates=[]; let fees=null;
  for(const q of Q){
    if(q.type==='text'||q.type==='multi') continue;
    const list = q.scale?SCALE4:q.opts;
    sec[q.sec].m += Math.max(...list.map(o=>o[1]));
    const a = answers[q.id]; if(!a) continue;
    sec[q.sec].e += a.points;
    if(q.gate && a.label===q.gate) failedGates.push(q.label.slice(0,50));
    if(q.fees) fees = a.label;
  }
  // المشاهدة: محتوى ترفيهي كثيف يخصم من المحور القيمي
  const w = answers.watch||[]; sec.values.m += 2;
  const ent = w.filter(x=>['أنمي','مسلسلات','أفلام','مقاطع قصيرة (تيك توك / ريلز / شورتس)'].includes(x)).length;
  sec.values.e += (w.length===0||ent===0) ? 2 : (ent===1 ? 1 : 0);
  // المتابعون: لا يتابع أحدًا أو قنوات نافعة فقط = 2، خليط = 1، مشاهير ألعاب فقط = 0.5
  const y = answers.youtube||[]; sec.values.m += 2;
  const useful = y.every(x=>['لا يتابع أحدًا بعينه','قنوات قرآن وتعليم'].includes(x));
  sec.values.e += y.length===0||useful ? 2 : (y.some(x=>x==='قنوات قرآن وتعليم') ? 1 : 0.5);

  const pctOf = s => s.m ? Math.round(s.e/s.m*1000)/10 : 0;
  const parts = { commit:pctOf(sec.commit), values:pctOf(sec.values), ready:pctOf(sec.ready) };
  const earned = sec.commit.e+sec.values.e+sec.ready.e, max = sec.commit.m+sec.values.m+sec.ready.m;
  const pct = Math.round(earned/max*1000)/10;
  if(parts.values < MIN_VALUES) failedGates.push('المحور التربوي القيمي دون الحد الأدنى ('+parts.values+'%)');
  const passed = failedGates.length===0 && pct>=PASS_PCT;
  let category;
  if(!passed) category = 'غير مناسب حاليًا';
  else if(['مرتفعة علينا، ونحتاج دعمًا جزئيًا','لا نستطيع حاليًا، لكننا نرغب بشدة'].includes(fees)) category = 'جاهز — والرسوم عائق';
  else category = 'جاهز تمامًا';
  return { pct, parts, passed, failedGates, fees, category };
}

function submitForm(e){
  e.preventDefault();
  const g = id => (document.getElementById(id)?.value||'').trim();
  let ok = true;
  if(!/^05\d{8}$/.test(g('phone'))){ document.getElementById('e_phone').style.display='block'; ok=false; } else document.getElementById('e_phone').style.display='none';
  if(g('email') && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(g('email'))){ document.getElementById('e_email').style.display='block'; ok=false; } else document.getElementById('e_email').style.display='none';
  let first=null;
  for(const q of Q){
    if(q.type==='text') continue;
    const a = answers[q.id];
    const missing = q.type==='multi' ? !(a&&a.length) : !a;
    if(missing){ document.getElementById('e_'+q.id).style.display='block'; ok=false; first=first||q.id; }
  }
  if(!ok){ document.getElementById('e_top').style.display='block'; if(first) document.getElementById('e_'+first).closest('.field').scrollIntoView({behavior:'smooth',block:'center'}); return false; }

  const r = evaluate();
  const record = { _sheet:SHEET_TAB,
    'اسم_الطالب':g('student_name'), 'الصف':g('grade'), 'العمر':g('age'), 'المدرسة':g('school'),
    'ولي_الأمر':g('guardian'), 'صلة_القرابة':g('relation'), 'الجوال':g('phone'), 'البريد':g('email'),
    'النسبة':r.pct+'%', 'نسبة_الالتزام':r.parts.commit+'%', 'نسبة_القيمي':r.parts.values+'%', 'نسبة_الاستعداد':r.parts.ready+'%',
    'النتيجة':r.passed?'مرشّح للمقابلة':'غير مناسب حاليًا', 'التصنيف':r.category,
    'بوابات_ساقطة':r.failedGates.join(' | ')||'—', 'وضع_الرسوم':r.fees||'' };
  for(const q of Q){ const a=answers[q.id]; record['س_'+q.id] = a==null ? '' : (Array.isArray(a)?a.join('، '):(typeof a==='object'?a.label:a)); }
  const btn=document.querySelector('.submit'); btn.disabled=true; btn.textContent='جارٍ الإرسال…';
  save(record);
  setTimeout(()=>renderResult(g('student_name')), 400);
  return false;
}

function save(record){
  if(!SHEETS_URL || SHEETS_URL.startsWith('PASTE')) return;
  fetch(SHEETS_URL,{ method:'POST', mode:'no-cors', body:JSON.stringify(record) }).catch(()=>{});
}
